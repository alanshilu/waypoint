# The whole stack: PostGIS, the backend (migrates the database on start) and the frontend.
#   cp .env.example .env    # add ORS_API_KEY and ANTHROPIC_API_KEY
#   docker compose up --build
# Then open http://localhost:8080. Only the frontend is published; it proxies /api to the backend.

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waypoint}
      POSTGRES_DB: waypoint
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./Backend
    environment:
      DB_HOST: db
      DB_USER: waypoint
      DB_PASS: ${POSTGRES_PASSWORD:-waypoint}
      DB_NAME: waypoint
      ORS_API_KEY: ${ORS_API_KEY:?Set ORS_API_KEY in .env (copy .env.example)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PUBLIC_DEMO: ${PUBLIC_DEMO:-false}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-${INTERNAL_API_SECRET:-}}
      AGENT_DAILY_TURN_CAP: ${AGENT_DAILY_TURN_CAP:-200}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_PUBLIC_DEMO: ${PUBLIC_DEMO:-false}
    ports:
      - "${WAYPOINT_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
