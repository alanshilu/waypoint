[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["alembic/versions", "typings"]

[tool.ruff.lint]
# Ruff's default rule set (pyflakes plus the pycodestyle error rules)
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These scripts put Backend/ on sys.path before importing the app
"app/create_tables.py" = ["E402"]
"app/delete_tables.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
