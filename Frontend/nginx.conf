server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The JS bundle and the highway network (public/data/highways.json, 480 KB) shrink to about a third.
    # text/event-stream isn't listed, so the agent's streamed replies are never buffered for compression.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml;

    # The API, same-origin: /api/trips/1 -> backend:8000/trips/1
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The agent streams server-sent events and a turn can take a few minutes
        proxy_buffering off;
        proxy_read_timeout 300s;
        # The internal secret is for the agent's own calls inside the backend container; never from browsers
        proxy_set_header X-Waypoint-Internal "";
    }

    # Single-page app: unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
